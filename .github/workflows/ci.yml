# File: ci.yml
# Purpose: Verify TypeScript, React, Storybook, package, browser, accessibility, bundle, and repository contracts.
# Jobs: independent least-privilege checks run on pushes, pull requests, and manual dispatch.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }} component verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint with zero warnings
        run: npm run lint
      - name: Check strict types
        run: npm run typecheck
      - name: Run component tests and coverage thresholds
        run: npm run test
      - name: Upload coverage evidence
        if: always() && matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: component-coverage
          path: coverage
          if-no-files-found: warn

  package:
    name: Package, Storybook, and bundle verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build package, declarations, and demo site
        run: npm run build
      - name: Enforce compressed bundle budgets
        run: npm run bundle:check
      - name: Bound official Ubuntu mirror access on the disposable runner
        timeout-minutes: 1
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_OS" = "Linux"
          test "$(uname -m)" = "x86_64"
          . /etc/os-release
          test "$ID" = "ubuntu"
          test "$VERSION_ID" = "24.04"
          test -f /etc/apt/apt-mirrors.txt
          test -f /usr/share/keyrings/ubuntu-archive-keyring.gpg
          grep -Eq '^URIs:[[:space:]]+mirror[+]file:/etc/apt/apt-mirrors[.]txt[[:space:]]*$' /etc/apt/sources.list.d/ubuntu.sources
          grep -Eq '^Signed-By:[[:space:]]+/usr/share/keyrings/ubuntu-archive-keyring[.]gpg[[:space:]]*$' /etc/apt/sources.list.d/ubuntu.sources
          # Preserve source suites, components and signature checks; avoid the stalled HTTP Azure mirror.
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' |
            sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          # APT reads this leaf after the runner defaults; these are acquire, not APT::Acquire, keys.
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' |
            sudo tee /etc/apt/apt.conf.d/zzzz-portfolio-network >/dev/null
          apt_network_config="$(apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout)"
          printf '%s\n' "$apt_network_config"
          grep -Fx 'Acquire::Retries "1";' <<< "$apt_network_config"
          grep -Fx 'Acquire::http::Timeout "15";' <<< "$apt_network_config"
          grep -Fx 'Acquire::https::Timeout "15";' <<< "$apt_network_config"
      - name: Install operating-system browser dependencies
        timeout-minutes: 10
        run: npx playwright install-deps chromium
      - name: Install the exact locked Chromium browser
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Install packed artifact and exercise actual consumer React workflows
        run: npm run package:smoke
      - name: Build component documentation
        run: npm run build:storybook
      - name: Audit complete locked dependency graph
        run: npm audit --audit-level=moderate
      - name: Upload package evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-and-storybook
          path: |
            dist
            storybook-static
            docs/reports/generated/bundle-budget.json
          if-no-files-found: error

  browser:
    name: Desktop and mobile accessibility workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Bound official Ubuntu mirror access on the disposable runner
        timeout-minutes: 1
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_OS" = "Linux"
          test "$(uname -m)" = "x86_64"
          . /etc/os-release
          test "$ID" = "ubuntu"
          test "$VERSION_ID" = "24.04"
          test -f /etc/apt/apt-mirrors.txt
          test -f /usr/share/keyrings/ubuntu-archive-keyring.gpg
          grep -Eq '^URIs:[[:space:]]+mirror[+]file:/etc/apt/apt-mirrors[.]txt[[:space:]]*$' /etc/apt/sources.list.d/ubuntu.sources
          grep -Eq '^Signed-By:[[:space:]]+/usr/share/keyrings/ubuntu-archive-keyring[.]gpg[[:space:]]*$' /etc/apt/sources.list.d/ubuntu.sources
          # Preserve source suites, components and signature checks; avoid the stalled HTTP Azure mirror.
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' |
            sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          # APT reads this leaf after the runner defaults; these are acquire, not APT::Acquire, keys.
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' |
            sudo tee /etc/apt/apt.conf.d/zzzz-portfolio-network >/dev/null
          apt_network_config="$(apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout)"
          printf '%s\n' "$apt_network_config"
          grep -Fx 'Acquire::Retries "1";' <<< "$apt_network_config"
          grep -Fx 'Acquire::http::Timeout "15";' <<< "$apt_network_config"
          grep -Fx 'Acquire::https::Timeout "15";' <<< "$apt_network_config"
      - name: Install operating-system browser dependencies
        timeout-minutes: 10
        run: npx playwright install-deps chromium
      - name: Install the exact locked Chromium browser
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Run keyboard, axe, RTL, motion, and vanilla scenarios
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-report
          path: |
            playwright-report
            test-results
          if-no-files-found: warn

  repository:
    name: Repository and documentation validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Test publication boundaries and validate repository content
        run: npm run repository:check
      - name: Confirm generated code index is current
        run: node scripts/generate-code-index.mjs --check
      - name: Validate shell syntax
        run: bash -n scripts/verify.sh
